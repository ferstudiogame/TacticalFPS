name: TacticalFPS Android verified build

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - ".github/workflows/android_release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tacticalfps-android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  APK_NAME: "TacticalFPS_Industrial_PVP.apk"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Godot project from repository archive
        shell: bash
        run: |
          set -euo pipefail
          find source -maxdepth 1 -type f -name 'TacticalFPS_Godot472_source.zip.b64.part-*' | sort > "$RUNNER_TEMP/parts.txt"
          test -s "$RUNNER_TEMP/parts.txt"
          while IFS= read -r part; do cat "$part"; done < "$RUNNER_TEMP/parts.txt" > "$RUNNER_TEMP/project.zip.b64"
          base64 -d "$RUNNER_TEMP/project.zip.b64" > "$RUNNER_TEMP/project.zip"
          unzip -tq "$RUNNER_TEMP/project.zip"
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/project"
          project_file="$(find "$RUNNER_TEMP/project" -name project.godot -type f -print -quit)"
          test -n "$project_file"
          rsync -a "$(dirname "$project_file")/" "$GITHUB_WORKSPACE/"
          test -f project.godot

      - name: Fix Godot joystick class-name collision
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^class_name VirtualJoystick$' scripts/VirtualJoystick.gd
          sed -i 's/^class_name VirtualJoystick$/class_name FerVirtualJoystick/' scripts/VirtualJoystick.gd
          sed -i 's/VirtualJoystick/FerVirtualJoystick/g' scripts/TouchHUD.gd
          grep -q '^class_name FerVirtualJoystick$' scripts/VirtualJoystick.gd
          grep -q 'var _joystick: FerVirtualJoystick' scripts/TouchHUD.gd
          grep -q '_joystick = FerVirtualJoystick.new()' scripts/TouchHUD.gd

      - name: Enable Android ETC2 ASTC texture import
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^textures/vram_compression/import_etc2_astc=' project.godot; then
            sed -i 's|^textures/vram_compression/import_etc2_astc=.*|textures/vram_compression/import_etc2_astc=true|' project.godot
          elif grep -q '^\[rendering\]$' project.godot; then
            sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' project.godot
          else
            printf '\n[rendering]\ntextures/vram_compression/import_etc2_astc=true\n' >> project.godot
          fi
          grep -q '^textures/vram_compression/import_etc2_astc=true$' project.godot

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk"
          sdkmanager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Install Godot 4.7.2 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl --fail --location --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=$GODOT_VERSION" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          godot="$(find "$RUNNER_TEMP/godot" -type f -name "Godot_v${GODOT_VERSION}-stable_linux.x86_64" -print -quit)"
          test -n "$godot"
          chmod +x "$godot"
          "$godot" --version
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=$GODOT_VERSION" -o "$RUNNER_TEMP/templates/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates/templates.tpz" -d "$RUNNER_TEMP/templates/unpacked"
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          cp -a "$RUNNER_TEMP/templates/unpacked/templates/." "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"

      - name: Create temporary Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import, parse and smoke-test project
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --import 2>&1 | tee build/import.log
          import_status=${PIPESTATUS[0]}
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee build/editor.log
          editor_status=${PIPESTATUS[0]}
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --quit-after 10 2>&1 | tee build/runtime.log
          runtime_status=${PIPESTATUS[0]}
          if [ "$import_status" -ne 0 ] || [ "$editor_status" -ne 0 ] || [ "$runtime_status" -ne 0 ]; then
            echo "Godot headless validation failed."
            exit 1
          fi
          if grep -nE 'SCRIPT ERROR|Parse Error|Failed to load script|Failed to load resource|Failed loading resource' build/*.log; then
            echo "Godot reported script or resource errors."
            exit 1
          fi

      - name: Export Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^textures/vram_compression/import_etc2_astc=true$' project.godot
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --export-debug "Android ARM64 Debug" "build/$APK_NAME"
          test -s "build/$APK_NAME"
          file "build/$APK_NAME"
          unzip -tq "build/$APK_NAME"

      - name: Upload APK and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TacticalFPS-verified-build-${{ github.run_number }}
          path: |
            build/TacticalFPS_Industrial_PVP.apk
            build/*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish verified APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "verified-android-${{ github.run_number }}"
          name: "TacticalFPS Android verified ${{ github.run_number }}"
          body: |
            Godot 4.7.2 ARM64 APK.
            Passed headless import, editor parse, runtime smoke test and APK archive integrity test.
          files: build/TacticalFPS_Industrial_PVP.apk
          fail_on_unmatched_files: true
          make_latest: true
