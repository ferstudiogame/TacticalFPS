name: Build Tactical FPS Industrial PvP

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - ".github/workflows/build_android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tactical-fps-industrial-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  APK_NAME: "TacticalFPS_Industrial_PVP.apk"

jobs:
  build-android:
    name: Validate Godot project and export Android ARM64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct original project from repository source parts
        shell: bash
        run: |
          set -euo pipefail
          test -d source
          find source -maxdepth 1 -type f -name 'TacticalFPS_Godot472_source.zip.b64.part-*' | sort > "$RUNNER_TEMP/source-parts.txt"
          test -s "$RUNNER_TEMP/source-parts.txt"
          while IFS= read -r part; do cat "$part"; done < "$RUNNER_TEMP/source-parts.txt" > "$RUNNER_TEMP/project.zip.b64"
          base64 -d "$RUNNER_TEMP/project.zip.b64" > "$RUNNER_TEMP/project.zip"
          unzip -tq "$RUNNER_TEMP/project.zip"
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/project"
          PROJECT_FILE="$(find "$RUNNER_TEMP/project" -name project.godot -type f -print -quit)"
          test -n "$PROJECT_FILE"
          SOURCE_DIR="$(dirname "$PROJECT_FILE")"
          rsync -a --exclude='.github/' "$SOURCE_DIR/" "$GITHUB_WORKSPACE/"
          test -f "$GITHUB_WORKSPACE/project.godot"
          echo "Recovered project at $GITHUB_WORKSPACE"

      - name: Patch Godot 4.7 native class-name collision
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^class_name VirtualJoystick$/class_name FerVirtualJoystick/' scripts/VirtualJoystick.gd
          sed -i 's/VirtualJoystick/FerVirtualJoystick/g' scripts/TouchHUD.gd
          grep -q '^class_name FerVirtualJoystick        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_PATH"
          SDKMANAGER="$(find "$SDK_PATH/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "$SDK_PATH/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl --fail --location --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=${GODOT_VERSION}" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 3 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/godot-version.txt"
          grep -q '^4.7.2' "$RUNNER_TEMP/godot-version.txt"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=${GODOT_VERSION}" -o "$RUNNER_TEMP/templates/export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates/export_templates.tpz" -d "$RUNNER_TEMP/templates/unpacked"
          TEMPLATE_SOURCE="$RUNNER_TEMP/templates/unpacked/templates"
          if [ ! -d "$TEMPLATE_SOURCE" ]; then TEMPLATE_SOURCE="$RUNNER_TEMP/templates/unpacked"; fi
          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DEST"
          cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DEST/"
          test -n "$(find "$TEMPLATE_DEST" -maxdepth 1 -type f | head -n 1)"

      - name: Create temporary Android debug key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"

      - name: Import project and validate runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --import 2>&1 | tee build/import.log
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee build/editor.log
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --quit-after 5 2>&1 | tee build/runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Failed to load resource|Failed loading resource' build/*.log; then
            echo "Godot reported a script or resource error." >&2
            exit 1
          fi

      - name: Export Android ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --export-debug "Android ARM64 Debug" "build/${APK_NAME}"
          test -s "build/${APK_NAME}"
          file "build/${APK_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TacticalFPS-Industrial-PVP-Android
          path: build/TacticalFPS_Industrial_PVP.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "industrial-pvp-${{ github.run_number }}"
          name: "Tactical FPS Industrial PvP ${{ github.run_number }}"
          body: |
            Godot 4.7.2 Android ARM64 debug build.
            - Industrial arena and supplied SWAT character.
            - Multitouch fire + camera input.
            - Bot perception, pursuit, flanking and cover.
            - Temporary debug signature for testing.
            - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: build/TacticalFPS_Industrial_PVP.apk
          fail_on_unmatched_files: true
          make_latest: true
 scripts/VirtualJoystick.gd
          grep -q 'var _joystick: FerVirtualJoystick' scripts/TouchHUD.gd
          grep -q '_joystick = FerVirtualJoystick.new()' scripts/TouchHUD.gd
          echo "Fixed native class-name collision without changing joystick behavior."

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_PATH"
          SDKMANAGER="$(find "$SDK_PATH/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "$SDK_PATH/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

